name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Match the Node.js version used for Cloudflare Pages (NODE_VERSION=22).
          node-version: 22
          cache: "npm"

      - run: npm ci

      # The same build Cloudflare Pages runs. The files in tests/ are not run here:
      # their test packages are not installed and they need updating first.
      - run: npm run build

      # Runs init.sql in a real Postgres and checks review submit, edit, and moderation.
      - run: npm run check:schema
